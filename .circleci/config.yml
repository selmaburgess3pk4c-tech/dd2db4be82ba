            printf 'latency 200ms\n' > chaos.cfg
      - run:
          name: Build fault injector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target chaoslatency -j2
      - run:
          name: Inject latency fault
          command: LIONSS_LP=1 ./build/chaoslatency --conf chaos.cfg --target svc-a

